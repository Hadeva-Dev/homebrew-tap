name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 (Sonoma) runners are retired; Sonoma is covered by the tart VM matrix instead
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tap this checkout
        # audit and test are developer commands: Homebrew loads a third-party tap for them only once it is trusted
        run: brew tap hadeva-dev/tap "$GITHUB_WORKSPACE" && brew trust hadeva-dev/tap
      - name: Audit
        run: brew audit --strict --new --online hadeva-dev/tap/dawnmere
      - name: Install from source
        run: brew install --build-from-source --verbose hadeva-dev/tap/dawnmere
      - name: Test
        run: brew test --verbose hadeva-dev/tap/dawnmere
      - name: Commands on PATH
        run: |
          brew info hadeva-dev/tap/dawnmere
          command -v dawnmere lflabs-memory
          dawnmere --help

  published:
    # what a user gets: the tap as GitHub serves it
    if: github.ref == 'refs/heads/main'
    needs: formula
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Tap from GitHub, untrusted
        run: |
          brew tap hadeva-dev/tap
          brew info dawnmere && echo "info works untrusted" || echo "info refused until the tap is trusted"
      - name: Trusted
        run: brew trust hadeva-dev/tap && brew info dawnmere
