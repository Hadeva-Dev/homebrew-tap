name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tap this checkout
        run: brew tap hadeva-dev/tap "$GITHUB_WORKSPACE"
      - name: Audit
        run: brew audit --strict --new --online hadeva-dev/tap/dawnmere
      - name: Install from source
        run: brew install --build-from-source --verbose hadeva-dev/tap/dawnmere
      - name: Test
        run: brew test --verbose hadeva-dev/tap/dawnmere
      - name: Commands on PATH
        run: |
          brew info hadeva-dev/tap/dawnmere
          command -v dawnmere lflabs-memory
          dawnmere --help

  published:
    # what a user gets: the tap as GitHub serves it
    if: github.ref == 'refs/heads/main'
    needs: formula
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - run: brew tap hadeva-dev/tap && brew info dawnmere
